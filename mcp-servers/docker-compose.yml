services:
  papers-search-mcp-server:
    build:
      context: ..
      dockerfile: mcp-servers/papers-search-mcp-server/Dockerfile
    container_name: papers-search-mcp-server
    env_file:
      - ./papers-search-mcp-server/.env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "7331:7331"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',7331),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  
  chemical-mcp-server:
    build:
      context: ./chemical-mcp-server
      dockerfile: Dockerfile
    ports:
      - "7332:7331"
    volumes:
      - ./data:/tmp/chemical_mcp_annotated
    env_file:
      - ./chemical-mcp-server/.env
    restart: unless-stopped
    healthcheck:
      test:
